<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>

    <style>
        body {
            margin: 0;
            background: #131313;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Top bar */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
        }

        .btn {
            padding: 10px 14px;
            background: #7ecbff;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .btn:hover {
            opacity: 0.8;
        }

        /* PDF container */
        .pdf-container {
            width: 100%;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fallback message */
        .fallback {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .fallback a {
            color: #7ecbff;
        }
    </style>
</head>

<body>

<!-- Back button -->
<div class="top-bar">
    <a class="btn" href="index.html">← Back</a>
</div>

<!-- PDF Viewer -->
<div class="pdf-container">
    <iframe
            src="https://Lars-05.github.io/Docs/CV.pdf">
    </iframe>
</div>

<!-- Fallback (if iframe fails) -->
<div class="fallback">
    <p>Your browser cannot display the PDF.</p>
    <a href="https://Lars-05.github.io/Docs/CV.pdf" target="_blank">
        Open Resume
    </a>
</div>

</body>
</html>
